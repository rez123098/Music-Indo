Auth: |
  <b>Pengguna yang Dibenarkan boleh menggunakan arahan Admin tanpa hak admin dalam chat anda</b>

  <b>✧ {0}</b> [Username] - Tambahkan pengguna ke dalam SENARAI AUTH kumpulan.

  <b>✧ {1}</b> [Username] - Keluarkan pengguna daripada SENARAI AUTH kumpulan.

  <b>✧ {2}</b> - Semak SENARAI AUTH kumpulan.

Admin: |
  <b>c merujuk kepada main saluran</b>

  <b>✧ {0}</b> - Jeda muzik yang sedang dimainkan.
  <b>✧ {1}</b> - Sambung semula muzik yang telah dijeda.
  <b>✧ {2}</b> - Matikan bunyi muzik yang sedang dimainkan.
  <b>✧ {3}</b> - Nyahaktifkan bunyi muzik yang dimatikan.
  <b>✧ {4}</b> - Langkau muzik yang sedang dimainkan.
  <b>✧ {5}</b> - Berhenti muzik yang sedang dimainkan.
  <b>✧ {6}</b> - Randomly shuffle the queued playlist/songs.
  <b>✧ {7}</b> - Acak senarai lagu/playlist yang disenaraikan.
  <b>✧ {8}</b> - Cari semula muzik ke durasi anda.
  <b>✧ {9}</b> - Mulakan semula bot untuk chat anda.

  <b>✧ {4}</b> [Number (Example: 3)] - Langkau muzik ke nombor tertentu. Contoh: <b>/skip 3</b> akan melangkau ke lagu ketiga dalam senarai dan akan mengabaikan lagu 1 dan 2 dalam senarai.
  <b>✧ {10}</b> [Enable/Disable] atau [Number between 1-10] - Apabila diaktifkan, bot akan mengulang lagu semasa sebanyak 1-10 kali dalam sembang suara. Nilai ulang lalai ialah 10 kali.


Active: |
  <b>✧ {0}</b> - Semak sembang suara aktif pada bot.

  <b>✧ {1}</b> - Semak panggilan suara dan video aktif pada bot.

  <b>✧ {2}</b> - Semak panggilan video aktif pada bot.

  <b>✧ {3}</b> - Semak statistik bot.

Play: |
  <b>✧ {0}</b> - Bot akan mula memainkan permintaan anda di voice chat atau menstrim pautan secara langsung di voice chat.

  <b>✧ {1}</b> - Force Play akan menghentikan lagu yang sedang dimainkan di voice chat dan terus memainkan lagu yang dicari tanpa mengganggu atau mengosongkan senarai giliran.

  <b>✧ {2}</b> - Sambungkan saluran ke kumpulan dan strim muzik di voice chat saluran daripada kumpulan anda.

  <b>✧ {3}</b> - Strim URL yang anda percaya adalah pautan terus atau m3u8 yang tidak boleh dimainkan menggunakan /play.

G-cast: |
  <b>{0} [Message or Reply to any message]</b> » Broadcast ke semua chat yang dilayan oleh bot.<u>Broadcast Modes:</u>

  <b><code>-pin</code></b> » Menetapkan mesej siaran anda sebagai pin di chat yang dilayan oleh bot.

  <b><code>-pinloud</code></b> » Menetapkan mesej siaran anda sebagai pin di chat yang dilayan oleh bot dan menghantar pemberitahuan kepada ahli.

  <b><code>-user</code></b> » Siarkan mesej kepada pengguna yang telah memulakan bot anda. [You can also pin the message by adding `-pin` or `-pinloud`]

  <b><code>-assistant</code></b> » Siarkan mesej anda melalui semua pembantu bot.

  <b><code>-nobot</code></b> » Pastikan bahawa **bot** tidak menyiarkan mesej. [Useful when you don't want to broadcast the message to groups]

  > <b>Example:</b> <code>/{0} -user -assistant -pin Testing broadcast</code>


Bot: |
  <b>★ {0}</b> - Dapatkan Statistik 10 Teratas Lagu Global, 10 Pengguna Teratas Bot, 10 Chat Teratas di Bot, 10 Lagu Paling Dimainkan dalam Chat, dan sebagainya.

  <b>★ {1}</b> - Periksa pengguna Sudo bot.

  <b>★ {2} [Music Name]</b> - Carian lirik untuk muzik tertentu di web.

  <b>★ {3} [Track Name] atau [YT Link]</b> - Muat turun mana-mana lagu dari YouTube dalam format MP3 atau MP4.

  <b>★ {4}</b> - Semak senarai antrian muzik.

  <u><b>⚡️Private Bot:</b></u>
      
  <b>✧ {5} [CHAT_ID]</b> - Benarkan chat untuk menggunakan bot anda.

  <b>✧ {6} [CHAT_ID]</b> - Larangkan chat daripada menggunakan bot anda.

  <b>✧ {7}</b> - Semak semua chat yang dibenarkan untuk bot anda.


P-List: |
  <b>{0}</b> - Semak keseluruhan senarai main anda di pelayan bot.

  <b>{1}</b> - Padamkan mana-mana lagu dari senarai main yang disimpan anda.

  <b>{2}</b> - Mulakan mainkan senarai main yang disimpan anda di **audio**

  <b>{3}</b> - Mulakan mainkan senarai main anda di **video**

B-list: |
  <b>✧ {0}</b> [chat ID] - Blacklist mana-mana chat daripada menggunakan Bot Muzik.
  <b>✧ {1}</b> [chat ID] - Whitelist mana-mana chat yang telah disenaraihitamkan daripada menggunakan Bot Muzik.
  <b>✧ {2}</b> - Semak semua chat yang disekat.

  <b>✧ {3}</b> [Username or reply to a user] - Mencegah pengguna daripada menggunakan arahan bot.
  <b>✧ {4}</b> [Username or reply to a user] - Buang pengguna dari senarai sekatan bot.
  <b>✧ {5}</b> - Semak senarai pengguna yang disekat.

  <b>✧ {6}</b> [Username or reply to a user] - Jadikan pengguna global disekat dari semua chat yang dilayani dan halang mereka daripada menggunakan bot anda.
  <b>✧ {7}</b> [Username or reply to a user] - Alihkan pengguna dari senarai gban bot dan benarkan mereka menggunakan bot anda.
  <b>✧ {8}</b> - Semak senarai pengguna gban.

Dev: |
  <b><u>Tambah dan buang sudoers:</u></b>

  <b>{0} [Username or reply to a user] - Tambah sudo dalam bot anda.</b>
  <b>{1} [Username or userid or reply to a user] - Keluarkan dari sudoers bot.</b>
  <b>{2} - Dapatkan senarai semua sudoers.
</b>

  <b><u>Heroku:</u></b>

  <b>{3}</b> - Dyno usage
  <b>{4} [Var Name]</b> - Dapatkan var konfigurasi daripada vars.
  <b>{5} [Var Name]</b> - Padamkan var daripada vars.
  <b>{6} [Var Name] [Value]</b> - Tambah atau kemas kini var. Asingkan var dan nilainya dengan ruang.

  <b><u>Bot command:</u></b>

  <b>{7}</b> - Mulakan semula bot (SUDOERS only)
  <b>{8}</b> - Kemas kini bot
  <b>{9}</b> - Semak kelajuan pelayan
  <b>{10} [enable / disable]</b> - Tukar mod penyelenggaraan bot
  <b>{11} [enable / disable]</b> - Tukar log carian bot ke dalam group log
  <b>{12} [Number of lines]</b> - Dapatkan log dari server.
  <b>{13} [enable / disable]</b> - Secara automatik hentikan siaran selepas 30 saat jika tiada sesiapa yang mendengar lagu.